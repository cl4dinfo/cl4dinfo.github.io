<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --font: 'Inter', sans-serif;
      --gap: 7px;
      --r-outer: 28px;
      --r-inner: 22px;
    }

    html {
      min-height: 100%;
      /* dark indigo at top fading down into white, like the reference */
      background: linear-gradient(180deg, #1a1f6e 0%, #2a3296 8%, #6b74c4 17%, #aab0e0 24%, #fafbfd 34%, #fafbfd 100%);
      background-attachment: fixed;
      background-size: 100% 100vh;
      background-repeat: no-repeat;
    }
    body {
      min-height: 100%;
      background: transparent;
      font-family: var(--font);
      color: #1c1c1c;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 18px 16px; max-width: 480px; margin: 0 auto;
      position: relative;
    }
    .header-left { display: flex; align-items: center; gap: 8px; position: relative; }
    .header-title { font-size: 27px; font-weight: 800; letter-spacing: -0.5px; color: #fafbfd; }


    /* ── GRID ── */
    .grid-wrapper { max-width: 480px; margin: 0 auto; padding: 0 14px 50px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .card-wrap { position: relative; }
    .card-wrap.card-featured { grid-row: span 2; }

    /* ── CARD — true liquid glass, no color fill ── */
    .card {
      border-radius: var(--r-inner);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 148px;
      padding: 16px 15px 15px;
      position: relative;
      cursor: pointer;
      transition: transform .18s cubic-bezier(.34,1.4,.64,1), box-shadow .18s;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.50);
      background: rgba(255,255,255,0.28);
      box-shadow:
        0 8px 24px -8px rgba(20,20,40,0.16),
        inset 0 1px 0 rgba(255,255,255,0.55);
    }
    .card-wrap.card-featured .card { height: 100%; }

    .card:hover  { transform: scale(1.03); background: rgba(255,255,255,0.36); box-shadow: 0 14px 32px -8px rgba(20,20,40,0.20), inset 0 1px 0 rgba(255,255,255,0.6); }
    .card:active { transform: scale(0.97); }

    /* glossy diagonal sheen, very subtle */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 50%);
      pointer-events: none;
      z-index: 0;
    }

    .card > * { position: relative; z-index: 1; }

    /* ── CARD TOP ── */
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .card-labels { display: flex; flex-direction: column; gap: 2px; }
    .card-title { font-size: 16px; font-weight: 700; color: #1c1c1c; line-height: 1.2; }
    .card-featured .card-title { font-size: 20px; font-weight: 800; }
    .card-subtitle { font-size: 12px; font-weight: 500; color: rgba(28,28,28,0.55); }
    .card-icon { flex-shrink: 0; }
    .card-icon svg { width: 28px; height: 28px; stroke: #1c1c1c; }

    .card-lock {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 600; color: rgba(28,28,28,0.45);
      text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 3px;
    }
    .card-lock svg { width: 10px; height: 10px; stroke: rgba(28,28,28,0.45); }

    /* ── CARD BOTTOM ── */
    .card-bottom { margin-top: auto; padding-top: 10px; }
    .card-value-label { font-size: 11px; font-weight: 600; color: rgba(28,28,28,0.45); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; transition: opacity .25s; }
    .card-value { font-size: 46px; font-weight: 800; letter-spacing: -2px; color: #1c1c1c; line-height: 1; overflow: hidden; position: relative; }
    .card-value-inner {
      display: block;
      transition: transform .22s cubic-bezier(.4,0,.2,1);
    }
    .card-value-label.label-fade { opacity: 0; }

    /* alt: short tagline footer for cards without a meaningful number */
    .card-tagline { font-size: 13px; font-weight: 600; color: rgba(28,28,28,0.55); line-height: 1.35; max-width: 130px; }


    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 100; align-items: flex-end; justify-content: center; padding: 0 0 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      display: flex;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: #fafbfd;
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 28px 28px 22px 22px;
      width: 100%; max-width: 480px; padding: 10px 22px 30px;
      box-shadow: 0 -2px 30px rgba(0,0,0,0.12);
      transform: translateY(50px); opacity: 0;
      transition: transform .28s cubic-bezier(.34,1.4,.64,1), opacity .22s ease;
    }
    .modal-overlay.open .modal {
      transform: translateY(0); opacity: 1;
    }
    .modal-handle { width: 38px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.12); margin: 0 auto 20px; }
    .modal-title { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; color: #1c1c1c; margin-bottom: 12px; }
    .modal-content { font-size: 13px; line-height: 1.72; color: #1c1c1c; white-space: pre-wrap; font-family: var(--font); margin: 0; }
    .modal-close-btn {
      margin-top: 22px; width: 100%; padding: 14px; border-radius: 16px; border: none;
      background: rgba(0,0,0,0.06); color: #1c1c1c; font-family: var(--font);
      font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
    }
    .modal-close-btn:hover { background: rgba(0,0,0,0.10); }

    /* ── SPLIT CARD — two halves inside one card-wrap ── */
    .card-split {
      display: flex;
      flex-direction: column;
      gap: 6px;
      height: 100%;
    }
    .card-half {
      flex: 1;
      border-radius: var(--r-inner);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 13px 14px 12px;
      position: relative;
      cursor: pointer;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.50);
      background: rgba(255,255,255,0.28);
      box-shadow: 0 4px 12px -4px rgba(20,20,40,0.12), inset 0 1px 0 rgba(255,255,255,0.55);
      transition: transform .18s cubic-bezier(.34,1.4,.64,1), background .18s;
    }
    .card-half:hover  { background: rgba(255,255,255,0.38); transform: scale(1.02); }
    .card-half:active { transform: scale(0.98); }
    .card-half::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 50%);
      pointer-events: none;
    }
    .card-half > * { position: relative; z-index: 1; }
    .card-half-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
    .card-half-top svg { width: 22px; height: 22px; stroke: #1c1c1c; flex-shrink: 0; }
    .card-half-title { font-size: 14px; font-weight: 700; color: #1c1c1c; }
    .card-half-sub { font-size: 11px; font-weight: 500; color: rgba(28,28,28,0.50); margin-top: 1px; }

    /* ── DONATE MODAL ── */
    .donate-modal { display: flex; flex-direction: column; gap: 14px; }
    .donate-desc {
      font-size: 13.5px; line-height: 1.65; color: rgba(28,28,28,0.60);
    }
    .donate-methods { display: flex; flex-direction: column; gap: 8px; }
    .donate-btn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1.5px solid rgba(28,28,28,0.10);
      background: rgba(28,28,28,0.04);
      cursor: pointer; text-decoration: none;
      transition: background .15s, border-color .15s;
    }
    .donate-btn:hover { background: rgba(28,28,28,0.08); border-color: rgba(28,28,28,0.18); }
    .donate-btn-left { display: flex; align-items: center; gap: 12px; }
    .donate-btn-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .donate-btn-label { font-size: 14px; font-weight: 700; color: #1c1c1c; }
    .donate-btn-sub   { font-size: 11px; font-weight: 500; color: rgba(28,28,28,0.45); margin-top: 1px; }
    .donate-btn-arrow svg { width: 16px; height: 16px; stroke: rgba(28,28,28,0.30); }

    /* ── SPLASH SCREEN ── */
    #splash {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(180deg, #1a1f6e 0%, #2a3296 30%, #6b74c4 65%, #fafbfd 100%);
      transition: opacity .6s ease;
    }
    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    #splash.done { display: none; }

    .splash-logo {
      font-family: var(--font);
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #fafbfd;
      opacity: 0;
      transform: translateY(12px);
      animation: splashIn .7s cubic-bezier(.34,1.4,.64,1) .3s forwards;
      position: relative; z-index: 1;
    }
    .splash-sub {
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: rgba(250,251,253,0.55);
      margin-top: 6px;
      opacity: 0;
      animation: splashIn .6s ease .6s forwards;
      position: relative; z-index: 1;
    }
    .splash-dots {
      display: flex; gap: 6px; margin-top: 48px;
      opacity: 0;
      animation: splashIn .5s ease .8s forwards;
      position: relative; z-index: 1;
    }
    .splash-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(250,251,253,0.35);
      animation: dotPulse 1.2s ease infinite;
    }
    .splash-dot:nth-child(2) { animation-delay: .2s; }
    .splash-dot:nth-child(3) { animation-delay: .4s; }

    @keyframes splashIn {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dotPulse {
      0%, 100% { background: rgba(250,251,253,0.25); transform: scale(1); }
      50%       { background: rgba(250,251,253,0.80); transform: scale(1.3); }
    }

    /* main content hidden until splash done */
    #main-content {
      opacity: 0;
      transition: opacity .6s ease;
    }
    #main-content.visible {
      opacity: 1;
    }

  </style>
</head>

    /* ── HOVER CYCLE ANIMATION ── */
    function setupCycle(cardId, labelId, valueId, params) {
      const card  = document.getElementById(cardId);
      const label = document.getElementById(labelId);
      const value = document.getElementById(valueId);
      let intervalTimer = null;
      let delayTimer = null;
      let idx = 0;

      let animating = false;
      let animEndTime = 0;

      function animateTo(i) {
        // track animation state
        animating = true;
        animEndTime = Date.now() + 560; // full cycle: 280ms out + 280ms in
        setTimeout(() => { animating = false; }, 560);

        // label — fade only
        label.classList.add('label-fade');
        setTimeout(() => {
          label.textContent = params[i].label;
          label.classList.remove('label-fade');
        }, 250);

        // value — drum: old exits UP, new enters from BELOW
        value.style.transition = 'transform .28s cubic-bezier(.4,0,.2,1)';
        value.style.transform = 'translateY(-110%)';
        setTimeout(() => {
          value.style.transition = 'none';
          value.style.transform = 'translateY(110%)';
          value.textContent = params[i].value;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            value.style.transition = 'transform .28s cubic-bezier(.4,0,.2,1)';
            value.style.transform = 'translateY(0)';
          }));
        }, 280);
      }

      card.addEventListener('mouseenter', () => {
        delayTimer = setTimeout(() => {
          idx = 1;
          animateTo(idx);
          intervalTimer = setInterval(() => {
            idx = (idx + 1) % params.length;
            animateTo(idx);
          }, 1500);
        }, 500);
      });

      card.addEventListener('mouseleave', () => {
        clearTimeout(delayTimer);
        clearInterval(intervalTimer);
        if (idx !== 0) {
          // wait until current animation finishes, then pause 500ms
          const remaining = animating ? animEndTime - Date.now() : 0;
          const wait = Math.max(0, remaining) + 500;
          delayTimer = setTimeout(() => {
            idx = 0;
            animateTo(0);
          }, wait);
        }
      });
    }

    setupCycle('vm-card', 'vm-label', 'vm-value', [
      { label: 'FOV',       value: '68'   },
      { label: 'OFFSET X',  value: '2.5'  },
      { label: 'OFFSET Y',  value: '2.0'  },
      { label: 'OFFSET Z',  value: '-2.0' },
    ]);

    setupCycle('ch-card', 'ch-label', 'ch-value', [
      { label: 'LENGTH',    value: '1.0'  },
      { label: 'THICKNESS', value: '1.0'  },
      { label: 'GAP',       value: '-4.0' },
      { label: 'OUTLINE',   value: '1.0'  },
    ]);


    /* ── ANTI-COPY PROTECTION ── */
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (e.ctrlKey && ['u','s','a','c'].includes(k)) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
    });
    document.addEventListener('dragstart', e => e.preventDefault());

    /* ── SPLASH ── */
    function runSplash() {
      const splash = document.getElementById('splash');
      const main   = document.getElementById('main-content');
      splash.classList.remove('hide', 'done');
      main.classList.remove('visible');


      setTimeout(() => {
        splash.classList.add('hide');
        main.classList.add('visible');
        setTimeout(() => splash.classList.add('done'), 650);
      }, 2000);
    }

    function restartSplash() {
      const splash = document.getElementById('splash');
      const main   = document.getElementById('main-content');
      splash.classList.remove('hide', 'done');
      main.classList.remove('visible');

      splash.querySelectorAll('.splash-dot').forEach(d => {
        d.style.animation = 'none';
        requestAnimationFrame(() => { d.style.animation = ''; });
      });
      setTimeout(() => {
        splash.classList.add('hide');
        main.classList.add('visible');
        setTimeout(() => splash.classList.add('done'), 650);
      }, 2000);
    }

    runSplash();
  </script>
